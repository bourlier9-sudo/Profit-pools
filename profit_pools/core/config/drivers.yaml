# Scenario driver catalog — which assumptions exist, where they may be
# applied and how. The scenario engine (Phase 4) and the assumption builder
# both read this file; nothing about eligibility is hardcoded in the UI.
#
# scope_kind   what the assumption's taxonomy scope points at
#   payer        a payer node (any level)            — cells: dataset × year × geo × payer leaf
#   spending     a recipient node (any level), optionally restricted by payer LOB / LOB group
#                and/or funding source               — cells: … × source × category
#   recipient    a recipient node (any level)        — cells: dataset × year × state × leaf
#   funding      a funding source (market only)      — cells: year × geo × source
#   top_down     a top-down node (any level)         — cells: year × leaf (market only)
# requires     data conditions; drivers are hidden where they are not met
#   instances    the category carries service instances (never pharmacy)
# methods      pct   multiplicative % change      (value 0.05 = +5%)
#              pp    additive percentage points   (value 0.01 = +1 pp)
#              set   absolute override of the driver level
#              delta additive change in driver units
# stage        pipeline stage that consumes the driver (ARCHITECTURE.md §5)
# Every assumption may also be scoped to one dataset (MARKET / ENTERPRISE) or both.
schema_version: 2

drivers:
  enrollment:
    label: "Enrollment"
    explains: "More or fewer members: premiums, medical claims (paid to providers and pharmacy) and admin cost all move with membership."
    unit: members_avg
    stage: 2
    scope_kind: payer
    methods: [pct, set, delta]
  enrollment_shift:
    label: "Members switching coverage"
    explains: "Members leave this segment for another plan or become uninsured; their spending follows them at the new coverage's rates."
    unit: members_avg
    stage: 2
    scope_kind: payer
    methods: [delta, pct]
    note: Moves members from the scoped segment to a named target segment or funding source; sum-preserving.
  premium_pmpm:
    label: "Premium rate (revenue per member)"
    explains: "Changes what members and employers pay the plan. Nothing downstream changes."
    unit: usd_pmpm
    stage: 3
    scope_kind: payer
    methods: [pct, set, delta]
  opex_pmpm:
    label: "Administrative cost per member"
    explains: "Changes the plan's own operating cost. Providers and pharmacy are unaffected."
    unit: usd_pmpm
    stage: 3
    scope_kind: payer
    methods: [pct, set, delta]
  opex_volume_scaling:
    label: "How admin cost scales with membership"
    explains: "Share of admin cost that varies with enrollment (100% = fully per member). User estimate."
    unit: ratio
    stage: 3
    scope_kind: payer
    methods: [set]
    default: 1.0
    user_estimate_only: true
    note: >-
      Share of baseline residual opex that varies with enrollment (1.0 = fully
      per-member, the model default). The data provides no estimate; this is
      offered only as a user-entered assumption.
  payer_margin:
    label: "Plan operating margin target"
    explains: "Reached by adjusting admin cost; premiums and claims are unchanged."
    unit: ratio
    stage: 3
    scope_kind: payer
    methods: [pp, set]
    note: Solved through residual opex PMPM; revenue and claims are unchanged.
  allowed_pmpm:
    label: "Medical cost trend paid by plans"
    explains: "Plans pay providers and pharmacy more (or less) per member: their claims rise, provider revenue rises by the same allowed dollars."
    unit: usd_pmpm
    stage: 4
    scope_kind: spending
    methods: [pct]
  member_cost_share:
    label: "Member cost sharing"
    explains: "Shifts who pays: more out-of-pocket means lower plan claims. Provider revenue is unchanged."
    unit: ratio
    stage: 4
    scope_kind: spending
    methods: [pp, set]
    note: >-
      Moves dollars between payer-paid and consumer spend. Recipient revenue
      (allowed) is unchanged; payer paid claims and gain change.
  utilization:
    label: "Utilization trend (services per member)"
    explains: "More services per member, paid by the selected payers at the same price: payer claims and provider revenue rise together."
    unit: instances_per_1000
    stage: 4
    scope_kind: spending
    requires: [instances]
    methods: [pct]
    user_estimate_only: true
  unit_price:
    label: "Reimbursement rate trend (price per service)"
    explains: "Payers pay a higher price per service: payer claims rise, provider revenue rises, volume unchanged."
    unit: usd_per_instance
    stage: 4
    scope_kind: spending
    requires: [instances]
    methods: [pct]
  funding_population:
    label: "Uninsured / government FFS population"
    explains: "More or fewer people in the uninsured or government fee-for-service groups; their spending follows them."
    unit: members_avg
    stage: 2
    scope_kind: funding
    basis: population_pmpm
    methods: [pct, set, delta]
  funding_pmpm:
    label: "Spending per person (uninsured / government FFS)"
    explains: "Changes what the uninsured or government programs pay providers per person."
    unit: usd_pmpm
    stage: 4
    scope_kind: spending
    basis: population_pmpm
    methods: [pct]
  supplemental_payments:
    label: "Supplemental & state payments to hospitals"
    explains: "State and supplemental program payments to hospitals; no other pool is affected."
    unit: usd_annual
    stage: 6
    scope_kind: funding
    basis: lump_sum
    methods: [pct, set]
  provider_margin:
    label: "Operating efficiency (margin)"
    explains: "The pool keeps more or less of each revenue dollar. Revenue and everyone else are unchanged."
    unit: ratio
    stage: 7
    scope_kind: recipient
    methods: [pp, set]
    note: Never applied to payers; payer margin is a separate driver.
  top_down_revenue:
    label: "Market size (top-down estimate)"
    explains: "Resizes a top-down market estimate. No payer or provider flows are affected."
    unit: usd_annual
    stage: 8
    scope_kind: top_down
    methods: [pct, set]
  top_down_margin:
    label: "Operating margin (top-down estimate)"
    explains: "Changes the margin of a top-down market estimate."
    unit: ratio
    stage: 8
    scope_kind: top_down
    methods: [pp, set]

# Forecast-year growth drivers (annual rates). A growth rate entered here is
# an INPUT; CAGRs shown in the UI are always computed from resulting values.
# Defaults live in baseline_forecast.yaml.
growth_drivers:
  enrollment_growth: {label: "Enrollment growth rate", scope_kind: payer, stage: 1}
  premium_trend: {label: "Premium trend", scope_kind: payer, stage: 1}
  opex_trend: {label: "Admin cost trend", scope_kind: payer, stage: 1}
  utilization_trend: {label: "Utilization trend (per year)", scope_kind: spending, stage: 1}
  unit_cost_trend: {label: "Reimbursement / unit-cost trend (per year)", scope_kind: spending, stage: 1}
  population_growth: {label: "Uninsured / government FFS population growth", scope_kind: funding, stage: 1}
  supplemental_growth: {label: "Supplemental payment growth", scope_kind: funding, stage: 1}
  top_down_growth: {label: "Market growth (top-down)", scope_kind: top_down, stage: 1}
